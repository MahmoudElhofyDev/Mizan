<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميزان | تعديل قضية</title>

<link rel="stylesheet" href="cases.css">

</head>


<body>


<header class="top">

<h1>⚖️ تعديل بيانات القضية</h1>

<p>تعديل ملف القضية</p>

</header>






<section class="container">


<div class="form-box">



<h2>
تعديل القضية
</h2>





<div class="inputs">



<input

id="fileNumber"

type="text"

placeholder="رقم الملف"

>



<input

id="caseNumber"

type="text"

placeholder="رقم القضية"

>



<input

id="clientName"

type="text"

placeholder="اسم الموكل"

>



<input

id="court"

type="text"

placeholder="المحكمة"

>



<input

id="caseType"

type="text"

placeholder="نوع القضية"

>



</div>







<div class="buttons">



<button onclick="saveCaseEdit()">

حفظ التعديل

</button>




<button onclick="goBack()">

رجوع

</button>



</div>



</div>



</section>






<script src="cases-edit.js"></script>


</body>


</html>
