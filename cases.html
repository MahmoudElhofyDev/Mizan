<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميزان | ملفات القضايا</title>

<link rel="stylesheet" href="cases.css">

</head>


<body>


<header class="top">

<h1>⚖️ ملفات القضايا</h1>

<p>إدارة بيانات القضايا</p>

</header>





<section class="container">



<div class="form-box">


<h2>
إضافة قضية جديدة
</h2>



<div class="inputs">



<input

id="fileNumber"

type="text"

placeholder="رقم الملف"



>



<input

id="caseNumber"

type="text"

placeholder="رقم القضية"



>



<input

id="clientName"

type="text"

placeholder="اسم الموكل"



>



<input

id="court"

type="text"

placeholder="المحكمة"



>



<input

id="caseType"

type="text"

placeholder="نوع القضية"



>



</div>






<div class="buttons">


<button onclick="addCase()">

إضافة

</button>



<button onclick="showLastFileNumber()">

آخر رقم ملف

</button>



</div>



</div>










<div class="search-box">


<input

id="search"

type="text"

placeholder="بحث..."

oninput="delaySearch()"



>


</div>









<table>


<thead>


<tr>


<th>
رقم الملف
</th>


<th>
رقم القضية
</th>


<th>
اسم الموكل
</th>


<th>
المحكمة
</th>


<th>
نوع القضية
</th>


<th>
تعديل
</th>


<th>
حذف
</th>


</tr>


</thead>





<tbody id="casesTable">


</tbody>



</table>







<div id="pagination">


</div>






</section>







<script src="cases.js"></script>



</body>


</html>
