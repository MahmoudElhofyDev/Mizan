<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
ميزان | ملفات الحفظ
</title>

<link rel="stylesheet" href="cases.css">

</head>


<body>


<header class="top">

<h1>
📁 ملفات الحفظ
</h1>

<p>
إدارة ملفات الحفظ
</p>

</header>





<section class="toolbar">



<button
class="gold"
onclick="openAddModal()">

➕ إضافة ملف

</button>




<button
class="blue"
id="lastFileBtn">

📂 آخر رقم ملف

</button>





<button
class="orange"
onclick="showIncompleteCases()">

⚠ البيانات الناقصة

</button>






<button
class="green"
onclick="document.getElementById('excelInput').click()">

📥 استيراد Excel

</button>





<input

type="file"

id="excelInput"

accept=".xlsx,.xls"

hidden

>





</section>







<section class="searchBox">



<input

id="searchInput"

type="text"

placeholder="ابحث برقم الملف أو اسم الموكل..."

onkeyup="searchCases()"

>



<button onclick="clearSearch()">

إعادة تعيين

</button>



</section>








<div
id="emptyMessage"
class="empty">


🔍

ابدأ بكتابة كلمة للبحث.

لن تظهر البيانات إلا بعد البحث.


</div>









<table id="casesTable">



<thead>

<tr>


<th>
رقم الملف
</th>


<th>
اسم الموكل
</th>


<th>
تعديل
</th>


<th>
حذف
</th>


</tr>


</thead>





<tbody id="casesBody">


</tbody>



</table>








<div
id="pagination"
class="pagination">

</div>









<!-- نافذة إضافة ملف -->


<div
id="addModal"
class="modal">



<div class="modal-content">



<h2>
إضافة ملف جديد
</h2>





<input

id="fileNumber"

type="text"

placeholder="رقم الملف"

>






<input

id="clientName"

type="text"

placeholder="اسم الموكل"

>







<div class="modal-buttons">



<button

class="save"

onclick="saveCase()">

حفظ

</button>






<button

class="cancel"

onclick="closeAddModal()">

إلغاء

</button>





</div>



</div>



</div>









<!-- نافذة تعديل -->


<div
id="editModal"
class="modal">



<div class="modal-content">





<input

type="hidden"

id="editId"

>




<h2>

تعديل الملف

</h2>






<input

id="editFileNumber"

type="text"

placeholder="رقم الملف"

>







<input

id="editClientName"

type="text"

placeholder="اسم الموكل"

>







<div class="modal-buttons">





<button

class="save"

onclick="updateCase()">

حفظ

</button>







<button

class="cancel"

onclick="closeEditModal()">

إلغاء

</button>





</div>






</div>



</div>









<!-- نافذة آخر رقم ملف -->


<div

id="lastFileModal"

class="modal">



<div class="modal-content small">





<h2>

آخر رقم ملف

</h2>






<h1 id="lastFileValue">

0

</h1>







<button

class="save"

onclick="closeLastFileModal()">

إغلاق

</button>







</div>



</div>









<!-- Toast -->


<div id="toast">


</div>








<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script src="cases.js"></script>




</body>


</html>
