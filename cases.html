<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>ميزان | القضايا</title>


<link rel="stylesheet" href="cases.css">


</head>



<body>


<header class="top">

<h1>
⚖️ ملفات القضايا
</h1>

<p>
إدارة بيانات القضايا
</p>

</header>





<div class="container">



<div class="actions">



<input 
type="text"
id="search"
placeholder="بحث..."
oninput="delaySearch()"
>



<input
type="text"
id="fileNumber"
placeholder="رقم الملف"
>



<input
type="text"
id="clientName"
placeholder="اسم الموكل"
>



<button onclick="addCase()">

إضافة قضية

</button>




</div>






<!-- استيراد Excel -->


<div class="import-box">


<input
type="file"
id="excelFile"
accept=".xlsx,.xls"
>



<button onclick="importCasesExcel()">

📥 استيراد Excel

</button>



</div>







<table>


<thead>

<tr>


<th>
رقم الملف
</th>



<th>
اسم الموكل
</th>



<th>
تعديل
</th>



<th>
حذف
</th>


</tr>


</thead>





<tbody id="casesTable">


</tbody>




</table>





<div id="pagination">

</div>




</div>








<script src="xlsx.full.min.js"></script>

<script src="cases.js"></script>



</body>


</html>
