<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميزان | تعديل توكيل</title>

<link rel="stylesheet" href="powers.css">

</head>


<body>


<header class="top">

<h1>📄 تعديل بيانات التوكيل</h1>

<p>تعديل ملف التوكيل</p>

</header>





<section class="container">


<div class="form-box">


<h2>
تعديل التوكيل
</h2>



<div class="inputs">


<input

id="fileNumber"

type="text"

placeholder="رقم الملف"

>



<input

id="powerNumber"

type="text"

placeholder="رقم التوكيل"

>



<input

id="clientName"

type="text"

placeholder="اسم الموكل"

>



<input

id="documentation"

type="text"

placeholder="التوثيق"

>



</div>







<div class="buttons">


<button onclick="savePowerEdit()">

حفظ التعديل

</button>




<button onclick="goBack()">

رجوع

</button>



</div>



</div>



</section>







<script src="powers-edit.js"></script>


</body>

</html>
