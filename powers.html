<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميزان | ملفات التوكيلات</title>

<link rel="stylesheet" href="powers.css">

</head>


<body>


<header class="top">

<h1>📄 ملفات التوكيلات</h1>

<p>إدارة بيانات التوكيلات</p>

</header>





<section class="container">


<div class="form-box">


<h2>
إضافة توكيل جديد
</h2>



<div class="inputs">


<input 
id="fileNumber"
type="text"
placeholder="رقم الملف">



<input 
id="powerNumber"
type="text"
placeholder="رقم التوكيل">



<input 
id="clientName"
type="text"
placeholder="اسم الموكل">



<input 
id="documentation"
type="text"
placeholder="التوثيق">



</div>




<div class="buttons">


<button onclick="addPower()">

إضافة

</button>



<button onclick="showLastFileNumber()">

آخر رقم ملف

</button>


</div>


</div>







<div class="search-box">


<input

id="search"

type="text"

placeholder="بحث..."

oninput="delaySearch()"


>


</div>








<table>


<thead>


<tr>


<th>
رقم الملف
</th>


<th>
رقم التوكيل
</th>


<th>
اسم الموكل
</th>


<th>
التوثيق
</th>


<th>
تعديل
</th>


<th>
حذف
</th>


</tr>


</thead>




<tbody id="powersTable">


</tbody>



</table>






<div id="pagination">

</div>





</section>





<script src="powers.js"></script>


</body>

</html>
