<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>ميزان | ملفات التوكيلات</title>


<link rel="stylesheet" href="powers.css">


</head>



<body>


<header class="top">

<h1>
📄 ملفات التوكيلات
</h1>


<p>
إدارة بيانات التوكيلات
</p>


</header>






<div class="container">



<div class="actions">



<input

type="text"

id="search"

placeholder="بحث..."

oninput="delaySearch()"

>




<input

type="text"

id="fileNumber"

placeholder="رقم الملف"

>



<input

type="text"

id="powerNumber"

placeholder="رقم التوكيل"

>



<input

type="text"

id="clientName"

placeholder="اسم الموكل"

>



<input

type="text"

id="documentation"

placeholder="التوثيق"

>





<button onclick="addPower()">

إضافة توكيل

</button>




</div>









<!-- استيراد Excel -->


<div class="import-box">


<input

type="file"

id="excelFile"

accept=".xlsx,.xls"

>



<button onclick="importPowersExcel()">

📥 استيراد Excel

</button>


</div>









<table>


<thead>


<tr>


<th>
رقم الملف
</th>



<th>
رقم التوكيل
</th>



<th>
اسم الموكل
</th>



<th>
التوثيق
</th>



<th>
تعديل
</th>



<th>
حذف
</th>


</tr>



</thead>





<tbody id="powersTable">


</tbody>



</table>







<div id="pagination">


</div>






</div>







<script src="xlsx.full.min.js"></script>


<script src="powers.js"></script>



</body>


</html>
