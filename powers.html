<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

ميزان | التوكيلات

</title>

<link
rel="stylesheet"
href="powers.css">

</head>

<body>

<header class="top">

<h1>

📄 التوكيلات

</h1>

<p>

إدارة بيانات التوكيلات

</p>

</header>





<section class="toolbar">

<button
class="gold"
onclick="openAddModal()">

➕ إضافة توكيل

</button>



<button
class="blue"
id="lastPowerBtn">

📂 آخر رقم توكيل

</button>

</section>





<section class="searchBox">

<input

id="searchInput"

type="text"

placeholder="ابحث برقم التوكيل أو اسم الموكل..."

onkeyup="searchPowers()"

>

<button
onclick="clearSearch()">

إعادة تعيين

</button>

</section>





<div
id="emptyMessage"
class="empty">

🔍

ابدأ بكتابة كلمة للبحث.

لن تظهر البيانات إلا بعد البحث.

</div>





<table
id="powersTable">

<thead>

<tr>

<th>

رقم التوكيل

</th>

<th>

اسم الموكل

</th>

<th>

التوثيق

</th>

<th>

تعديل

</th>

<th>

حذف

</th>

</tr>

</thead>

<tbody
id="powersBody">

</tbody>

</table>





<div
id="pagination"
class="pagination">

</div>

<!-- نافذة إضافة توكيل -->

<div
id="addModal"
class="modal">

<div class="modal-content">

<h2>

إضافة توكيل جديد

</h2>

<input

id="powerNumber"

type="text"

placeholder="رقم التوكيل">

<input

id="clientName"

type="text"

placeholder="اسم الموكل">

<input

id="documentation"

type="text"

placeholder="التوثيق">

<div class="modal-buttons">

<button

class="save"

onclick="savePower()">

حفظ

</button>

<button

class="cancel"

onclick="closeAddModal()">

إلغاء

</button>

</div>

</div>

</div>





<!-- نافذة تعديل -->

<div
id="editModal"
class="modal">

<div class="modal-content">

<input
type="hidden"
id="editId">

<h2>

تعديل التوكيل

</h2>

<input

id="editPowerNumber"

type="text"

placeholder="رقم التوكيل">

<input

id="editClientName"

type="text"

placeholder="اسم الموكل">

<input

id="editDocumentation"

type="text"

placeholder="التوثيق">

<div class="modal-buttons">

<button

class="save"

onclick="updatePower()">

حفظ

</button>

<button

class="cancel"

onclick="closeEditModal()">

إلغاء

</button>

</div>

</div>

</div>





<!-- نافذة آخر رقم توكيل -->

<div

id="lastPowerModal"

class="modal">

<div class="modal-content small">

<h2>

آخر رقم توكيل

</h2>

<h1
id="lastPowerValue">

0

</h1>

<button

class="save"

onclick="closeLastPowerModal()">

إغلاق

</button>

</div>

</div>





<!-- Toast -->

<div
id="toast">

</div>





<script
src="powers.js">

</script>

</body>

</html>
